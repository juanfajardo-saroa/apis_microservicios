# Pipeline completo para despliegue del microservicio SISPAE-API-Acceso
# Incluye: Build, Push to ACR, Deploy to AKS, Update Application Gateway

trigger: none  # Trigger manual para control

pool:
  name: 'Default'
  demands:
  - agent.name -equals vm-devops-prd

variables:
  # ACR Configuration
  acrName: 'azrcaksalimentosdev'
  acrLoginServer: 'azrcaksalimentosdev.azurecr.io'
  
  # Service Configuration
  serviceName: 'sispae-api-acceso'
  dockerfilePath: 'SISPAE.API_Acceso.Dockerfile'
  manifestPath: 'Deployment-API-Acceso-DEV.yaml'
  
  # AKS Configuration
  aksResourceGroup: 'SIPAE-DEV'
  aksClusterName: 'az-aks-alimentos-dev-westus2'
  aksNamespace: 'sige-pae'
  
  # Application Gateway Configuration
  appGatewayName: 'ag-aks-alimentos-dev'
  appGatewayResourceGroup: 'SIPAE-DEV'

stages:
- stage: ValidateAndBuild
  displayName: 'Validate & Build'
  jobs:
  - job: ValidateEnvironment
    displayName: 'Validate Environment'
    steps:
    - task: AzureCLI@2
      displayName: 'Validate Azure Resources'
      inputs:
        azureSubscription: 'svc-azure-destino'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Validating Azure Resources ==="
          
          # Validate ACR
          echo "Checking ACR: $(acrName)"
          az acr show --name $(acrName) --query "name" -o tsv
          
          # Validate AKS
          echo "Checking AKS: $(aksClusterName)"
          az aks show --resource-group $(aksResourceGroup) --name $(aksClusterName) --query "name" -o tsv
          
          # Validate Key Vault
          echo "Checking Key Vault access"
          az keyvault secret list --vault-name kv-alimentos-dev --query "[0].name" -o tsv
          
          echo "=== All resources validated successfully ==="

  - job: BuildAndPush
    displayName: 'Build and Push Docker Image'
    dependsOn: ValidateEnvironment
    steps:
    - task: Docker@2
      displayName: 'Login to ACR'
      inputs:
        containerRegistry: 'svc-acr-destino'
        command: 'login'

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        containerRegistry: 'svc-acr-destino'
        repository: '$(serviceName)-prd'
        command: 'build'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(Build.BuildId)
          latest

    - task: Docker@2
      displayName: 'Push Docker Image'
      inputs:
        containerRegistry: 'svc-acr-destino'
        repository: '$(serviceName)-prd'
        command: 'push'
        tags: |
          $(Build.BuildId)
          latest

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: ValidateAndBuild
  jobs:
  - job: DeployToAKS
    displayName: 'Deploy to AKS'
    steps:
    - task: KubernetesManifest@0
      displayName: 'Deploy to Kubernetes'
      inputs:
        action: 'deploy'
        kubernetesServiceConnection: 'svc-aks-destino'
        namespace: '$(aksNamespace)'
        manifests: |
          $(Build.SourcesDirectory)/deploy/optimized-$(serviceName)-deployment.yaml

    - task: Kubernetes@1
      displayName: 'Wait for Pod Ready'
      inputs:
        connectionType: 'Kubernetes Service Connection'
        kubernetesServiceEndpoint: 'svc-aks-destino'
        namespace: '$(aksNamespace)'
        command: 'wait'
        arguments: '--for=condition=Ready pod -l app=$(serviceName) --timeout=300s'

    - task: AzureCLI@2
      displayName: 'Update Application Gateway Backend'
      inputs:
        azureSubscription: 'svc-azure-destino'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Updating Application Gateway Backend ==="
          
          # Get pod IP
          POD_IP=$(kubectl get pods -n $(aksNamespace) -l app=$(serviceName) -o jsonpath='{.items[0].status.podIP}')
          echo "Pod IP: $POD_IP"
          
          # Update backend pool
          az network application-gateway address-pool update \
            --gateway-name $(appGatewayName) \
            --resource-group $(appGatewayResourceGroup) \
            --name appGatewayBackendPool \
            --servers $POD_IP
          
          echo "Backend pool updated with pod IP: $POD_IP"

- stage: Test
  displayName: 'Integration Tests'
  dependsOn: Deploy
  jobs:
  - job: TestDeployment
    displayName: 'Test Deployment'
    steps:
    - task: AzureCLI@2
      displayName: 'Test Pod Health'
      inputs:
        azureSubscription: 'svc-azure-destino'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Testing Pod Health ==="
          
          # Check pod status
          kubectl get pods -n $(aksNamespace) -l app=$(serviceName)
          
          # Test pod logs for errors
          echo "=== Pod Logs (last 20 lines) ==="
          kubectl logs -n $(aksNamespace) -l app=$(serviceName) --tail=20
          
          # Verify service
          kubectl get svc -n $(aksNamespace) -l app=$(serviceName)
          
          echo "=== Deployment test completed ==="

    - task: AzureCLI@2
      displayName: 'Test Application Gateway'
      inputs:
        azureSubscription: 'svc-azure-destino'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=== Testing Application Gateway ==="
          
          # Get Application Gateway public IP
          AG_IP=$(az network public-ip show --name ag-aks-alimentos-dev-pip --resource-group $(appGatewayResourceGroup) --query "ipAddress" -o tsv)
          echo "Application Gateway IP: $AG_IP"
          
          # Test connectivity (optional, may fail due to AG-Pod connectivity issue)
          echo "Note: This test may fail due to known AG-Pod connectivity limitations"
          curl -I "http://$AG_IP/" --connect-timeout 10 || echo "Expected: AG-Pod connectivity needs AGIC or service configuration"
          
          echo "=== Application Gateway test completed ==="

- stage: Report
  displayName: 'Deployment Report'
  dependsOn: Test
  condition: always()
  jobs:
  - job: GenerateReport
    displayName: 'Generate Deployment Report'
    steps:
    - task: AzureCLI@2
      displayName: 'Generate Deployment Summary'
      inputs:
        azureSubscription: 'svc-azure-destino'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "========================="
          echo "DEPLOYMENT SUMMARY REPORT"
          echo "========================="
          echo "Service: $(serviceName)"
          echo "Build ID: $(Build.BuildId)"
          echo "Date: $(date)"
          echo ""
          
          echo "=== ACR Images ==="
          az acr repository show-tags --name $(acrName) --repository $(serviceName)-prd --top 5
          
          echo ""
          echo "=== AKS Deployment Status ==="
          kubectl get pods,svc -n $(aksNamespace) -l app=$(serviceName)
          
          echo ""
          echo "=== Application Gateway Status ==="
          az network application-gateway show --name $(appGatewayName) --resource-group $(appGatewayResourceGroup) --query "operationalState" -o tsv
          
          echo ""
          echo "=== Next Steps ==="
          echo "1. ✅ Microservice deployed and running"
          echo "2. ⚠️  Application Gateway needs AGIC configuration for full connectivity"
          echo "3. 📋 Ready to scale to 30 microservices (pending vCPU quota increase)"
          echo ""
          echo "=== Deployment completed successfully! ==="